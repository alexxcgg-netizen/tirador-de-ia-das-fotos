name: Revela (IPA)

on:
  push:
    paths:
      - "camera-raw/**"
      - ".github/workflows/camera-raw.yml"
  workflow_dispatch:

# Só a versão mais nova compila: um envio novo cancela o que ainda estava esperando na fila
concurrency:
  group: revela-ipa
  cancel-in-progress: true

defaults:
  run:
    working-directory: camera-raw

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          # Desde o Xcode 26 o compilador Metal é um componente separado
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Gerar projeto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          set +e
          xcodebuild -project Revela.xcodeproj -scheme Revela -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          set -e
          # Mostra só o que importa, mas sem esconder a falha
          grep -E "error:|warning: .*/Revela/|BUILD (SUCCEEDED|FAILED)" build.log || true
          if [ $status -ne 0 ]; then
            echo "::error::xcodebuild falhou (código $status)"
            tail -80 build.log
            exit $status
          fi

      - name: Conferir o app
        run: |
          APP=build/Build/Products/Release-iphoneos/Revela.app
          ls -la "$APP"
          # O executável é o app em si; sem ele o .ipa não instala
          test -x "$APP/Revela"
          file "$APP/Revela" | grep -q "arm64"
          # Sem o metallib a revelação sai sem look
          test -f "$APP/default.metallib"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :MinimumOSVersion" -c "Print :NSCameraUsageDescription" -c "Print :NSPhotoLibraryAddUsageDescription" "$APP/Info.plist"
          du -sh "$APP"

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Revela.app Payload/
          zip -qry Revela.ipa Payload
          unzip -l Revela.ipa | grep -q "Payload/Revela.app/Revela$"
          ls -la Revela.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Revela-ipa
          path: camera-raw/Revela.ipa
          retention-days: 14
