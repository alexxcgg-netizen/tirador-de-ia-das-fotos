name: Revela
options:
  bundleIdPrefix: com.alexxcgg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.16.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Revela:
    type: application
    platform: iOS
    sources: [Revela]
    scheme: {}
    info:
      path: Revela/Info.plist
      properties:
        CFBundleDisplayName: Revela
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: O Revela usa a câmera para fotografar em RAW.
        NSMicrophoneUsageDescription: O Revela usa o microfone para gravar o som dos vídeos.
        NSPhotoLibraryAddUsageDescription: O Revela salva as fotos (DNG + revelada) na sua galeria.
        NSLocationWhenInUseUsageDescription: O Revela guarda onde cada foto foi tirada, para ela aparecer no mapa da galeria. Dá para desligar nos Ajustes do app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexxcgg.revela
        SWIFT_OBJC_BRIDGING_HEADER: Revela/Revela-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Os shaders em .ci.metal são kernels de Core Image
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -cikernel
